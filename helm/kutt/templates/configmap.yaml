apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kutt.fullname" . }}
  labels:
    {{- include "kutt.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.kutt.port | quote }}
  SITE_NAME: {{ .Values.kutt.siteName | quote }}
  DEFAULT_DOMAIN: {{ .Values.kutt.defaultDomain | quote }}
  TRUST_PROXY: {{ .Values.kutt.trustProxy | quote }}
  LINK_LENGTH: {{ .Values.kutt.linkLength | quote }}
  {{- if .Values.kutt.linkCustomAlphabet }}
  LINK_CUSTOM_ALPHABET: {{ .Values.kutt.linkCustomAlphabet | quote }}
  {{- end }}
  {{- if .Values.kutt.serverIpAddress }}
  SERVER_IP_ADDRESS: {{ .Values.kutt.serverIpAddress | quote }}
  {{- end }}
  {{- if .Values.kutt.serverCnameAddress }}
  SERVER_CNAME_ADDRESS: {{ .Values.kutt.serverCnameAddress | quote }}
  {{- end }}
  DISALLOW_REGISTRATION: {{ .Values.kutt.registration.disallowRegistration | quote }}
  DISALLOW_LOGIN_FORM: {{ .Values.kutt.registration.disallowLoginForm | quote }}
  DISALLOW_ANONYMOUS_LINKS: {{ .Values.kutt.registration.disallowAnonymousLinks | quote }}
  ENABLE_RATE_LIMIT: {{ .Values.kutt.features.enableRateLimit | quote }}
  CUSTOM_DOMAIN_USE_HTTPS: {{ .Values.kutt.features.customDomainUseHttps | quote }}
  {{- if .Values.kutt.features.reportEmail }}
  REPORT_EMAIL: {{ .Values.kutt.features.reportEmail | quote }}
  {{- end }}
  {{- if .Values.kutt.features.contactEmail }}
  CONTACT_EMAIL: {{ .Values.kutt.features.contactEmail | quote }}
  {{- end }}
  # Database
  DB_CLIENT: {{ include "kutt.dbClient" . | quote }}
  {{- if eq (include "kutt.dbClient" .) "better-sqlite3" }}
  DB_FILENAME: {{ .Values.kutt.db.filename | quote }}
  {{- else }}
  DB_HOST: {{ include "kutt.dbHost" . | quote }}
  DB_PORT: {{ include "kutt.dbPort" . | quote }}
  DB_NAME: {{ include "kutt.dbName" . | quote }}
  DB_USER: {{ include "kutt.dbUser" . | quote }}
  DB_SSL: {{ .Values.kutt.db.ssl | quote }}
  DB_POOL_MIN: {{ .Values.kutt.db.poolMin | quote }}
  DB_POOL_MAX: {{ .Values.kutt.db.poolMax | quote }}
  {{- end }}
  # Redis
  REDIS_ENABLED: {{ include "kutt.redisEnabled" . | quote }}
  {{- if eq (include "kutt.redisEnabled" .) "true" }}
  REDIS_HOST: {{ include "kutt.redisHost" . | quote }}
  REDIS_PORT: {{ .Values.kutt.redis.port | quote }}
  REDIS_DB: {{ .Values.kutt.redis.db | quote }}
  {{- end }}
  # Mail
  MAIL_ENABLED: {{ .Values.kutt.mail.enabled | quote }}
  {{- if .Values.kutt.mail.enabled }}
  MAIL_HOST: {{ .Values.kutt.mail.host | quote }}
  MAIL_PORT: {{ .Values.kutt.mail.port | quote }}
  MAIL_SECURE: {{ .Values.kutt.mail.secure | quote }}
  MAIL_USER: {{ .Values.kutt.mail.user | quote }}
  {{- if .Values.kutt.mail.from }}
  MAIL_FROM: {{ .Values.kutt.mail.from | quote }}
  {{- end }}
  {{- end }}
  # OIDC
  OIDC_ENABLED: {{ .Values.kutt.oidc.enabled | quote }}
  {{- if .Values.kutt.oidc.enabled }}
  OIDC_ISSUER: {{ .Values.kutt.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.kutt.oidc.clientId | quote }}
  {{- if .Values.kutt.oidc.scope }}
  OIDC_SCOPE: {{ .Values.kutt.oidc.scope | quote }}
  {{- end }}
  {{- if .Values.kutt.oidc.emailClaim }}
  OIDC_EMAIL_CLAIM: {{ .Values.kutt.oidc.emailClaim | quote }}
  {{- end }}
  {{- end }}

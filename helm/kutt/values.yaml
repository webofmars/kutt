# Default values for kutt.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: kutt/kutt
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: kutt.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: kutt-tls
  #    hosts:
  #      - kutt.example.com

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /api/v2/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/v2/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# -----------------------------------------------------------------------
# Kutt application configuration
# -----------------------------------------------------------------------
kutt:
  # -- Application port
  port: 3000

  # -- The name of the site where Kutt is hosted
  siteName: "Kutt"

  # -- The domain that this website is on (e.g. "kutt.example.com")
  defaultDomain: ""

  # -- Whether Kutt is running behind a proxy server.
  # If true, the real client IP will be taken from the X-Forwarded-For header.
  trustProxy: true

  # -- Generated link length
  linkLength: 6

  # -- Alphabet used to generate custom addresses.
  # Default omits o, O, 0, i, I, l, 1, and j to avoid confusion when reading the URL.
  linkCustomAlphabet: ""

  # -- Display-only: Server IP address shown on the settings page
  serverIpAddress: ""

  # -- Display-only: Server CNAME address shown on the settings page
  serverCnameAddress: ""

  auth:
    # -- REQUIRED: A passphrase to encrypt JWT. Use a long random string.
    jwtSecret: ""
    # -- Name of an existing secret containing the JWT secret.
    # The secret must have a key named "JWT_SECRET".
    # If set, jwtSecret is ignored.
    existingSecret: ""

  registration:
    # -- Disable user registration (default: true)
    disallowRegistration: true
    # -- Disable form-based login. Only makes sense when OIDC is enabled.
    disallowLoginForm: false
    # -- Disable anonymous link creation (default: true)
    disallowAnonymousLinks: true

  # -----------------------------------------------------------------------
  # Database configuration
  # -----------------------------------------------------------------------
  # Configure one of: postgresql, mariadb, or sqlite sub-sections.
  # If postgresql.enabled or mariadb.enabled (sub-charts), the relevant settings
  # are configured automatically.
  # -----------------------------------------------------------------------
  db:
    # -- Database client driver.
    # Options: better-sqlite3 | pg | mysql2
    # Automatically set when postgresql.enabled or mariadb.enabled is true.
    client: "better-sqlite3"

    # -- SQLite database file path. Only used when client is "better-sqlite3".
    filename: "/var/lib/kutt/data.sqlite"

    # -- External database host. Not needed if postgresql.enabled or mariadb.enabled.
    host: ""

    # -- External database port. Not needed if postgresql.enabled or mariadb.enabled.
    port: ""

    # -- Database name. Not needed if postgresql.enabled or mariadb.enabled.
    name: "kutt"

    # -- Database user. Not needed if postgresql.enabled or mariadb.enabled.
    user: ""

    # -- Database password for external databases.
    password: ""

    # -- Enable SSL for database connections.
    ssl: false

    # -- Minimum database connection pool size.
    poolMin: 0

    # -- Maximum database connection pool size.
    poolMax: 10

    # -- Name of an existing secret with the DB password.
    # The secret must have a key named "DB_PASSWORD".
    # If set, db.password is ignored.
    existingSecret: ""

  # -----------------------------------------------------------------------
  # Redis configuration
  # -----------------------------------------------------------------------
  redis:
    # -- Enable Redis caching and rate-limiting backend.
    # Automatically set to true when redis.enabled (sub-chart) is true.
    enabled: false

    # -- Redis host. Not needed if redis.enabled (sub-chart) is true.
    host: ""

    # -- Redis port.
    port: 6379

    # -- Redis password. Leave empty if Redis has no authentication.
    password: ""

    # -- Redis database number (0-15).
    db: 0

    # -- Name of an existing secret with the Redis password.
    # The secret must have a key named "REDIS_PASSWORD".
    # If set, redis.password is ignored.
    existingSecret: ""

  # -----------------------------------------------------------------------
  # Mail (SMTP) configuration
  # -----------------------------------------------------------------------
  mail:
    # -- Enable email functionality (verification, password reset, reports).
    enabled: false

    # -- SMTP server host.
    host: ""

    # -- SMTP server port.
    port: 587

    # -- Use SSL/TLS for SMTP connection.
    secure: true

    # -- SMTP username.
    user: ""

    # -- SMTP password.
    password: ""

    # -- Sender address, e.g. "Kutt <support@example.com>". Leave empty to use mail.user.
    from: ""

    # -- Name of an existing secret with the mail password.
    # The secret must have a key named "MAIL_PASSWORD".
    # If set, mail.password is ignored.
    existingSecret: ""

  # -----------------------------------------------------------------------
  # Additional features
  # -----------------------------------------------------------------------
  features:
    # -- Enable rate limiting for some API routes.
    enableRateLimit: false

    # -- Use HTTPS for links with custom domain.
    customDomainUseHttps: false

    # -- The email address that receives submitted reports.
    reportEmail: ""

    # -- Support email shown in the app.
    contactEmail: ""

  # -----------------------------------------------------------------------
  # OpenID Connect (OIDC) configuration
  # -----------------------------------------------------------------------
  oidc:
    # -- Enable OIDC-based authentication.
    enabled: false

    # -- OIDC issuer URL.
    issuer: ""

    # -- OIDC client ID.
    clientId: ""

    # -- OIDC client secret.
    clientSecret: ""

    # -- OIDC scope (e.g. "openid profile email").
    scope: ""

    # -- Name of the claim in the OIDC token that contains the user email. Defaults to "email".
    emailClaim: ""

    # -- Name of an existing secret with the OIDC client secret.
    # The secret must have a key named "OIDC_CLIENT_SECRET".
    # If set, oidc.clientSecret is ignored.
    existingSecret: ""

# -----------------------------------------------------------------------
# SQLite persistence (only used when postgresql.enabled=false and mariadb.enabled=false)
# -----------------------------------------------------------------------
persistence:
  # -- Enable persistent volume for SQLite database file.
  enabled: true
  # -- StorageClass for the PVC. Set to "" to use the default.
  storageClass: ""
  # -- Access modes for the PVC.
  accessModes:
    - ReadWriteOnce
  # -- Size of the persistent volume.
  size: 1Gi
  # -- Name of an existing PVC to use. If set, a new PVC is not created.
  existingClaim: ""

# -----------------------------------------------------------------------
# PostgreSQL sub-chart (Bitnami)
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
# -----------------------------------------------------------------------
postgresql:
  # -- Enable the Bitnami PostgreSQL sub-chart.
  # When enabled, the kutt.db settings are automatically configured.
  enabled: false
  auth:
    # -- Database name to create.
    database: kutt
    # -- Database user.
    username: kutt
    # -- Database password. Leave empty to auto-generate.
    password: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi

# -----------------------------------------------------------------------
# MariaDB sub-chart (Bitnami)
# https://github.com/bitnami/charts/tree/main/bitnami/mariadb
# -----------------------------------------------------------------------
mariadb:
  # -- Enable the Bitnami MariaDB sub-chart.
  # When enabled, the kutt.db settings are automatically configured.
  enabled: false
  auth:
    # -- Database name to create.
    database: kutt
    # -- Database user.
    username: kutt
    # -- Database password. Leave empty to auto-generate.
    password: ""
    # -- MariaDB root password. Leave empty to auto-generate.
    rootPassword: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi

# -----------------------------------------------------------------------
# Redis sub-chart (Bitnami)
# https://github.com/bitnami/charts/tree/main/bitnami/redis
# -----------------------------------------------------------------------
redis:
  # -- Enable the Bitnami Redis sub-chart.
  # When enabled, kutt.redis settings are automatically configured.
  enabled: false
  auth:
    # -- Enable Redis authentication.
    enabled: false
    # -- Redis password. Leave empty to auto-generate when auth.enabled is true.
    password: ""
  master:
    persistence:
      enabled: true
      size: 8Gi
  replica:
    replicaCount: 0
